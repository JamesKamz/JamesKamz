name: Profile cards

on:
  schedule:
    - cron: "17 3 * * *" # every day
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-cards.yml"]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub stats cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Optional: add a SUMMARY_GITHUB_TOKEN secret (classic PAT: repo + read:user)
          # to include private-repo activity. Falls back to the built-in token.
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: tokyonight
          TIME_ZONE: Africa/Casablanca
          AUTO_PUSH: false

      # Publish the cards on a separate "stats" branch so main stays clean.
      - name: Publish cards to the stats branch
        run: |
          cd profile-summary-card-output
          git init -q -b stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update profile cards"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" stats
