<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="James Kamz — Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="0.55" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .name{font:800 64px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#ffffff;letter-spacing:1px}
      .role{font:700 30px 'Segoe UI',Helvetica,Arial,sans-serif;fill:url(#accent);letter-spacing:4px}
      .meta{font:400 18px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#cbd5e1;letter-spacing:1px}
      .code{font:600 16px Consolas,'Courier New',monospace;fill:#67e8f9;opacity:.55}
      .cursor{animation:blink 1.1s steps(1) infinite}
      .float{animation:float 6s ease-in-out infinite}
      @keyframes blink{50%{opacity:0}}
      @keyframes float{50%{transform:translateY(-8px)}}
    </style>
  </defs>
  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <circle cx="1080" cy="40" r="140" fill="#22d3ee" opacity="0.10"/>
  <circle cx="120" cy="270" r="110" fill="#6366f1" opacity="0.12"/>

  <g class="float">
    <text x="880" y="70" class="code">&lt;Next.js /&gt;</text>
    <text x="1000" y="120" class="code">Django · FastAPI</text>
    <text x="900" y="170" class="code">PostgreSQL</text>
    <text x="1010" y="215" class="code">Docker · CI/CD</text>
    <text x="870" y="250" class="code">{ Odoo + AI }</text>
  </g>

  <text x="70" y="115" class="name">James Kamz</text>
  <text x="72" y="168" class="role">FULL-STACK DEVELOPER<tspan class="cursor" fill="#22d3ee">_</tspan></text>
  <rect x="72" y="188" width="90" height="4" rx="2" fill="#22d3ee"/>
  <text x="72" y="228" class="meta">Koffi Jacques Amouzou · Casablanca, Morocco · SaaS · APIs · Cloud</text>
</svg>
